apiVersion: apps/v1
kind: Deployment
metadata:
  name: cafe-app
  labels:
    app: cafe-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cafe-app
  template:
    metadata:
      labels:
        app: cafe-app
    spec:
      containers:
        - name: cafe-app
          # Replace with your published Docker Hub image before applying.
          image: YOUR_DOCKERHUB_USERNAME/cafe-app:latest
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
